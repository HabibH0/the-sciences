schema_version: 1
concept:
  id: strong_disjunction
  title: {en: "Strong Disjunction", ar: "مَانِعَةُ الخُلُوّ وَالجَمْع", transliteration: "māniʿat al-khuluww wa-al-jamʿ"}
  type: relationship
  definition: {en: "Exactly one alternative must be true: neither both nor neither is possible."}
  prerequisites: [disjunctive_syllogism]
  properties: {both_allowed: false, neither_allowed: false, affirming_valid: true, denying_valid: true}
  skills: [reason_with_strong_disjunction]
  exercise_families: [rule_application, validity_classification]
  source: {book_id: fst_logic, pages: [60, 61]}
