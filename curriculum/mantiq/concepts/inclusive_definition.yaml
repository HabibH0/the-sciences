schema_version: 1
concept:
  id: inclusive_definition
  type: rule
  title:
    en: Inclusive definition
    ar: جَامِع
    transliteration: jāmiʿ
  definition: A definition is inclusive when it includes every member that fits the term.
  objectives:
    knowledge:
      - State what makes a definition inclusive.
    skills:
      - Identify a definition that excludes valid members.
      - Explain why a proposed definition is too restrictive.
  prerequisites: []
  source: { book_id: fst_logic, pages: [12] }
  examples:
    - id: muslim_hajj
      term: Muslim
      proposed_definition: someone who performs Hajj
      result: not_inclusive
      rationale: Some Muslims are unable to perform Hajj.
  exercise_families: [recognition, error_detection, compare_and_distinguish]
  mastery: { minimum_accuracy: 0.85, minimum_application_questions: 2 }
