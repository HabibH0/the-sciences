schema_version: 1
concept:
  id: coextensive_relation
  type: relationship
  title:
    en: Coextensive universals
    ar: التَّسَاوِيْ
    transliteration: al-tasāwī
  definition: Two universals are coextensive when both have exactly the same members.
  objectives:
    knowledge:
      - State the membership condition for coextensive universals.
    skills:
      - Classify two categories with identical membership.
      - Select the matching single-set Venn representation.
  prerequisites: [universal_term]
  source: { book_id: fst_logic, pages: [16] }
  examples:
    - id: wudhu_ablution
      left: wudhu
      right: ablution
      relation: coextensive
      venn: coincident_sets
  exercise_families: [classification, visual_reasoning, compare_and_distinguish]
  mastery: { minimum_accuracy: 0.85, minimum_application_questions: 2 }
