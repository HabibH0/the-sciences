schema_version: 1
concept:
  id: metaphysical_mode_basis
  title:
    en: "Metaphysical Basis of Mode"
    ar: "حُكْم عَقْلِي"
    transliteration: "ḥukm ʿaqlī"
  type: classification
  definition:
    en: "A metaphysical relationship is affirmed or negated through rational rather than empirical evidence."
  prerequisites: [proposition_mode, physical_mode_basis]
  properties: { evidence_basis: rational }
  knowledge:
    - "The textbook distinguishes rational evidence from observation and experiment."
  skills:
    - identify_metaphysical_evidence_basis
  exercise_families: [classification, compare_and_distinguish]
  source: { book_id: fst_logic, pages: [25] }
