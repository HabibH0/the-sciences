name: Release

# Builds Windows/macOS/Linux installers and publishes them to the public
# HabibH0/the-sciences-releases repo's Releases page. This repo itself stays
# private -- only the built artifacts + release notes go public.
#
# Triggered by pushing a tag like v1.2.0:
#   git tag v1.2.0 && git push origin v1.2.0

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package
            artifact-glob: dist/*.exe
          - os: macos-latest
            script: package:mac
            artifact-glob: dist/*.zip
          - os: ubuntu-latest
            script: package:linux
            artifact-glob: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to the-sciences-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/*/* \
            --repo HabibH0/the-sciences-releases \
            --title "${{ github.ref_name }}" \
            --notes "$(cat <<'NOTES'
          See the README for install instructions per platform.

          These builds are unsigned, so your OS will warn about an
          unrecognized publisher on first run -- that's expected, not a
          sign anything is wrong. See the README for how to proceed on
          each platform.
          NOTES
          )"
