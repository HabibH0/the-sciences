<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Sciences — Arabic Grammar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Replaces the OS title bar (main.cjs creates the window with frame:
       false). Both pieces are position:fixed -- they float OVER whatever
       the app is currently rendering rather than reserving their own
       layout row (a dedicated strip read as an unwanted extra bar with a
       stray border under it -- see .app-header's own border-bottom, which
       only looked wrong because of the empty strip that used to sit above
       it). Deliberately static markup OUTSIDE #root: #root's innerHTML is
       wholesale replaced on every app render (see render() in
       js/render.js), including the launch screen, which has no
       .app-header at all -- this has to survive all of that and stay in
       the DOM regardless of what view the app is showing.

       #window-drag-region: a thin, always-present, invisible strip across
       the very top for moving the window -- thin enough (see styles.css)
       to sit above every screen's real content without intercepting clicks
       meant for it.

       #window-controls: the three window-control buttons, pinned to the
       absolute top-right corner like an OS title bar's own controls always
       are -- invisible until hovered, so nothing about this reads as "the
       app's own header" the rest of the time. -->
  <div id="window-drag-region"></div>
  <div id="window-controls">
    <button id="window-minimize" type="button" aria-label="Minimize" data-action="minimizeWindow">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" aria-hidden="true">
        <line x1="1" y1="5" x2="9" y2="5"/>
      </svg>
    </button>
    <button id="window-maximize" type="button" aria-label="Maximize" data-action="toggleMaximizeWindow">
      <svg class="restore-icon" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="1" y="3" width="6" height="6"/>
        <path d="M3 3V1h6v6H7"/>
      </svg>
      <svg class="maximize-icon" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" aria-hidden="true">
        <rect x="1.5" y="1.5" width="7" height="7"/>
      </svg>
    </button>
    <button id="window-close" type="button" aria-label="Close" data-action="closeWindow">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" aria-hidden="true">
        <line x1="1" y1="1" x2="9" y2="9"/>
        <line x1="9" y1="1" x2="1" y2="9"/>
      </svg>
    </button>
  </div>
  <div id="root"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
