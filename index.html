<!doctype html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    (() => {
      const themes = {
        manuscript: { bg: '#f3f2f2', scheme: 'light' },
        mushaf: { bg: '#f7f1e1', scheme: 'light' },
        lamp: { bg: '#16130f', scheme: 'dark' },
        ink: { bg: '#eceef1', scheme: 'light' },
        sepia: { bg: '#ece0ca', scheme: 'light' },
      };
      try {
        const raw = localStorage.getItem('the-sciences-progress');
        const stored = raw ? JSON.parse(raw) : {};
        const progress = stored && typeof stored === 'object' && stored.progress
          ? stored.progress
          : stored;
        const theme = themes[progress.theme] ? progress.theme : 'manuscript';
        const accent = progress.accent || 'gold';
        const chrome = themes[theme];
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.accent = accent;
        document.documentElement.style.colorScheme = chrome.scheme;
        document.documentElement.style.backgroundColor = chrome.bg;
        let meta = document.querySelector('meta[name="theme-color"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.setAttribute('name', 'theme-color');
          document.head.appendChild(meta);
        }
        meta.setAttribute('content', chrome.bg);
      } catch (e) {
        document.documentElement.dataset.theme = 'manuscript';
        document.documentElement.dataset.accent = 'gold';
        document.documentElement.style.colorScheme = 'light';
        document.documentElement.style.backgroundColor = themes.manuscript.bg;
        const meta = document.createElement('meta');
        meta.setAttribute('name', 'theme-color');
        meta.setAttribute('content', themes.manuscript.bg);
        document.head.appendChild(meta);
      }
    })();
  </script>
  <title>The Sciences — Arabic Grammar</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Vanilla ES modules, no bundler (see AGENTS.md) means the browser only
       discovers this app's import graph one file at a time: fetch main.js,
       parse it for its imports, fetch those, parse THEM for their imports,
       and so on -- each of those is a full network round trip on the web
       build, stacking into several seconds on a real connection before the
       first screen can render (harmless on the Electron build, which reads
       these over file:// with near-zero latency).
       modulepreload tells the browser to start fetching (Chromium: and
       parsing) every file below in parallel from the moment <head> is read,
       instead of waiting to discover each one through the file that imports
       it -- collapsing that wave-by-wave fetch into one. This is every
       module js/main.js's own import graph pulls in before first render;
       course content (content-fstu, content-sarf, content/module-*.js) and
       lazily-loaded تركيب/lit chapter bodies stay out on purpose -- COURSE_LOADERS
       and content-lit/index.js's per-chapter load() already keep those out
       of the critical path (see content/meta.js, content-lit/index.js), and
       preloading them here would just re-add the weight this is meant to cut.
       Maintenance: content-lit/index.js eagerly imports every book's shell
       (chapter bodies stay lazy -- see content-lit/qasas-v12/index.js's own
       comment on that split), so a new book shell belongs in both places --
       add it to LIT_BOOKS there AND to this list here. -->

<body>
  <!-- Replaces the OS title bar (main.cjs creates the window with frame:
       false). Both pieces are position:fixed -- they float OVER whatever
       the app is currently rendering rather than reserving their own
       layout row (a dedicated strip read as an unwanted extra bar with a
       stray border under it -- see .app-header's own border-bottom, which
       only looked wrong because of the empty strip that used to sit above
       it). Deliberately static markup OUTSIDE #root: #root's innerHTML is
       wholesale replaced on every app render (see render() in
       js/render.js), including the launch screen, which has no
       .app-header at all -- this has to survive all of that and stay in
       the DOM regardless of what view the app is showing.

       #window-drag-region: a thin, always-present, invisible strip across
       the very top for moving the window -- thin enough (see styles.css)
       to sit above every screen's real content without intercepting clicks
       meant for it.

       #window-controls: the three window-control buttons, pinned to the
       absolute top-right corner like an OS title bar's own controls always
       are -- invisible until hovered, so nothing about this reads as "the
       app's own header" the rest of the time. -->
  <div id="window-drag-region"></div>
  <div id="window-controls">
    <button id="window-minimize" type="button" aria-label="Minimize" data-action="minimizeWindow">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" aria-hidden="true">
        <line x1="1" y1="5" x2="9" y2="5"/>
      </svg>
    </button>
    <button id="window-maximize" type="button" aria-label="Maximize" data-action="toggleMaximizeWindow">
      <svg class="restore-icon" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="1" y="3" width="6" height="6"/>
        <path d="M3 3V1h6v6H7"/>
      </svg>
      <svg class="maximize-icon" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" aria-hidden="true">
        <rect x="1.5" y="1.5" width="7" height="7"/>
      </svg>
    </button>
    <button id="window-close" type="button" aria-label="Close" data-action="closeWindow">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" aria-hidden="true">
        <line x1="1" y1="1" x2="9" y2="9"/>
        <line x1="9" y1="1" x2="1" y2="9"/>
      </svg>
    </button>
  </div>
  <div id="root"></div>
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
