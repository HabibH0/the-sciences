<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    (() => {
      const themes = {
        manuscript: { bg: '#f3f2f2', scheme: 'light' },
        mushaf: { bg: '#f7f1e1', scheme: 'light' },
        lamp: { bg: '#16130f', scheme: 'dark' },
        ink: { bg: '#eceef1', scheme: 'light' },
        sepia: { bg: '#ece0ca', scheme: 'light' },
      };
      try {
        const raw = localStorage.getItem('the-sciences-progress');
        const stored = raw ? JSON.parse(raw) : {};
        const progress = stored && typeof stored === 'object' && stored.progress
          ? stored.progress
          : stored;
        const theme = themes[progress.theme] ? progress.theme : 'manuscript';
        const accent = progress.accent || 'gold';
        const chrome = themes[theme];
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.accent = accent;
        document.documentElement.style.colorScheme = chrome.scheme;
        document.documentElement.style.backgroundColor = chrome.bg;
        let meta = document.querySelector('meta[name="theme-color"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.setAttribute('name', 'theme-color');
          document.head.appendChild(meta);
        }
        meta.setAttribute('content', chrome.bg);
      } catch (e) {
        document.documentElement.dataset.theme = 'manuscript';
        document.documentElement.dataset.accent = 'gold';
        document.documentElement.style.colorScheme = 'light';
        document.documentElement.style.backgroundColor = themes.manuscript.bg;
        const meta = document.createElement('meta');
        meta.setAttribute('name', 'theme-color');
        meta.setAttribute('content', themes.manuscript.bg);
        document.head.appendChild(meta);
      }
    })();
  </script>
  <title>The Sciences — Arabic Grammar</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Vanilla ES modules, no bundler (see AGENTS.md) means the browser only
       discovers this app's import graph one file at a time: fetch main.js,
       parse it for its imports, fetch those, parse THEM for their imports,
       and so on -- each of those is a full network round trip on the web
       build, stacking into several seconds on a real connection before the
       first screen can render (harmless on the Electron build, which reads
       these over file:// with near-zero latency).
       modulepreload tells the browser to start fetching (Chromium: and
       parsing) every file below in parallel from the moment <head> is read,
       instead of waiting to discover each one through the file that imports
       it -- collapsing that wave-by-wave fetch into one. This is every
       module js/main.js's own import graph pulls in before first render;
       course content (content-fstu, content-sarf, content/module-*.js) and
       lazily-loaded تركيب/lit chapter bodies stay out on purpose -- COURSE_LOADERS
       and content-lit/index.js's per-chapter load() already keep those out
       of the critical path (see content/meta.js, content-lit/index.js), and
       preloading them here would just re-add the weight this is meant to cut.
       Maintenance: content-lit/index.js eagerly imports every book's shell
       (chapter bodies stay lazy -- see content-lit/qasas-v12/index.js's own
       comment on that split), so a new book shell belongs in both places --
       add it to LIT_BOOKS there AND to this list here. -->
  <link rel="modulepreload" href="js/config.js" />
  <link rel="modulepreload" href="js/main.js" />
  <link rel="modulepreload" href="js/motion.js" />

  <!-- Boot placeholder: on the web build the module graph takes real time to
       arrive (see the modulepreload note above), and until now that time was
       a blank page. Replaced wholesale by the first rerender(); styled by
       the Boot section in styles.css, which inherits the pre-applied theme
       ground from the inline script above so it never flashes the wrong
