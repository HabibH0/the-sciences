<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Amiri';
    src: url('../vendor/fonts/Amiri-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  .canvas {
    width: 100vmin;
    height: 100vmin;
    background: radial-gradient(circle at 50% 42%, #f7f1e1 0%, #ece0ca 62%, #ddc79f 100%);
    position: relative;
  }
  .medallion {
    position: absolute;
    left: 8vmin;
    top: 8vmin;
    width: 84vmin;
    height: 84vmin;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #fbf6e8 0%, #efe0bb 55%, #cfa14a 100%);
    box-shadow: 0 0 0 2.2vmin #b68235;
  }
  .letter {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Amiri', serif;
    font-weight: 700;
    font-size: 52vmin;
    line-height: 1;
    color: #241a0f;
    transform: translateY(-3vmin);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="medallion"></div>
    <div class="letter">ع</div>
  </div>
</body>
</html>
