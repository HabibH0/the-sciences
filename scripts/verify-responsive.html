<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Responsive lesson verification</title>
  <style>
    body { margin: 0; background: #e8ebe9; }
    iframe { display: block; border: 0; margin: 0 auto; background: white; }
  </style>
</head>
<body>
  <iframe title="Lesson viewport"></iframe>
  <script>
    // A frame gives the lesson a reproducible viewport even when a host
    // browser keeps its own window dimensions fixed.
    const params = new URLSearchParams(location.search);
    const frame = document.querySelector('iframe');
    frame.width = Math.max(320, Math.min(1920, Number(params.get('width')) || 1024));
    frame.height = Math.max(540, Math.min(1200, Number(params.get('height')) || 600));
    if (params.has('overview')) {
      const course = params.get('overview');
      frame.src = `../#/course/${['mantiq', 'intro-nahw', 'intro-sarf', 'adv-nahw', 'adv-sarf'].includes(course) ? course : 'intro-nahw'}`;
    }
    else if (params.get('literature') === '1') {
      const lesson = params.get('lesson');
      frame.src = params.get('app') === '1' ? `../#/literature/lesson/${/^[a-z-]+$/.test(lesson || '') ? lesson : 'early-morning'}` : `./verify-literature-layout.html?scale=${encodeURIComponent(params.get('scale') || '1')}&font=${encodeURIComponent(params.get('font') || 'traditional')}`;
    }
    else if (params.get('app') === '1') {
      const lesson = params.get('lesson') || 'as-01/l1';
      frame.src = `../#/module/${/^[a-z0-9-]+\/l\d+$/.test(lesson) ? lesson : 'as-01/l1'}`;
    }
    else {
      params.delete('width'); params.delete('height');
      frame.src = `./verify-lesson-layout.html?${params}`;
    }
  </script>
</body>
</html>
